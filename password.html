<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
       
       p {
        font-size:large;
      }

      input{
        padding: 8px ;
        width: 250px;
        border-radius: 360px;
        border: 1px solid black;
      }

      button{
        display: block;
        width: 250px;
        margin-top:15px;
        padding-top: 8px;
        padding-bottom:8px;
        border-radius: 360px;
        border: 1px solid black;
      }

    </style>

</head>
<body>

    <p>Password Demo</p>
    <p>Enter a password any try the button .</p>
    <input id="password" type="password">
    <button id= "button" onclick="showPassword(); changeText()">Show Password</button>

    <script>
        function showPassword(){
            let password = document.getElementById("password");
            if(password.type === "password"){
                password.type ="text";
            
            }

            else{
                password.type ="password";
            }

        }

        function changeText(){
          let button = document.getElementById("button");

          if (button.textContent =="Show Password"){ button.textContent ="Hide Password";

          }

          else{
            button.textContent = "Show Password"
          }
        }
    </script>

</body>
</html>
