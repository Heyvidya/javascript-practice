<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            

         }

         h1{
            margin-top:100px;
            font-size:xxX-large;
            
         }


         p{
            font-style: italic;
         }

         input{
            width: 250px;
            border-radius: 360px;
            border: 1px solid black;
            height:30px;
            padding-left: 8px;
         }


         button{
            display: block;
            margin: auto;
            margin-top: 20px;
            padding: 8px 30px;
            border-radius: 360px;
            background-color: pink;
            color: black;
            border: 1px solid black;


         }

        


    </style>

</head>

<body>

    <h1>Love Calculator ❤️</h1>

    <p>Enter your name 👩</p>
    <input id="yourName" type="text" placeholder="Your name">

    <p>Enter your partner's name 👫</p>
    <input id="partnerName" type="text" placeholder="Partner's name">

    <button onclick="Calculator()">Calculate ❤️</button>

    <p id="result"></p>

    <script>
       
    function Calculator() {
        let name1 = document.getElementById("yourName").value.trim();
        let name2 = document.getElementById("partnerName").value.trim();

        if (name1 === "" || name2 === "") {
            document.getElementById("result").textContent =
                "Please enter both names ❤️";
        } else {
            let calculate = Math.floor(Math.random() * 101);

            document.getElementById("result").textContent =
                `${name1} and ${name2} have a love score of ${calculate}% ❤️`;
        }
    }
</script>


</body>
</html>
